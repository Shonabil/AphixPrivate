<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rapor Pemain · Aphix Private</title>
    <meta name="description" content="Akses rapor pemain Aphix Private untuk orang tua." />
    <!-- Halaman rapor tidak perlu muncul di Google -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B1C2D" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0B1C2D",
              navy2: "#0F2A44",
              accent: "#74B4DA",
              ink: "#2B6A94",
              cream: "#F2EDDB",
            },
            fontFamily: { sans: ["Poppins", "sans-serif"] },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: #0b1c2d;
        color: #f2eddb;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: #74b4da;
        color: #0b1c2d;
      }
      :focus-visible {
        outline: 2px solid #74b4da;
        outline-offset: 3px;
      }
      .glass {
        background: linear-gradient(180deg, rgba(242, 237, 219, 0.06), rgba(242, 237, 219, 0.02));
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(242, 237, 219, 0.09);
      }
      .logo-badge {
        background: #74b4da;
        border-radius: 999px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .logo-badge img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .field {
        width: 100%;
        background: rgba(242, 237, 219, 0.05);
        border: 1px solid rgba(242, 237, 219, 0.14);
        border-radius: 0.9rem;
        padding: 0.9rem 1rem;
        color: #f2eddb;
        outline: none;
        transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      }
      .field::placeholder {
        color: rgba(242, 237, 219, 0.35);
      }
      .field:focus {
        border-color: #74b4da;
        background: rgba(242, 237, 219, 0.08);
        box-shadow: 0 0 0 4px rgba(116, 180, 218, 0.15);
      }
      .btn {
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border-radius: 999px;
        font-weight: 600;
        transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.25s;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
      .btn-main {
        background: #f2eddb;
        color: #0b1c2d;
      }
      .btn-main:hover {
        background: #74b4da;
      }
      .btn-ghost {
        border: 1px solid rgba(242, 237, 219, 0.22);
        color: #f2eddb;
      }
      .btn-ghost:hover {
        border-color: #74b4da;
        color: #74b4da;
      }
      .btn[disabled] {
        opacity: 0.6;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col">
    <div class="pointer-events-none fixed -top-32 -left-32 w-[28rem] h-[28rem] bg-accent/15 rounded-full blur-3xl"></div>

    <header class="relative max-w-3xl w-full mx-auto px-4 sm:px-6 py-5 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <span class="logo-badge w-10 h-10"><img src="/images/aphixlogo-navy.png" alt="" /></span>
        <span class="leading-none">
          <span class="block text-lg font-extrabold tracking-wide">APHIX</span>
          <span class="block mt-1 text-[10px] font-semibold tracking-[0.38em] text-accent">PRIVATE</span>
        </span>
      </a>
      <a href="/" class="text-sm text-cream/60 hover:text-accent transition">&larr; Beranda</a>
    </header>

    <main class="relative flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 pt-8 pb-16">
      <p class="text-xs font-bold tracking-[0.22em] uppercase text-accent">Untuk Orang Tua</p>
      <h1 class="mt-3 text-3xl sm:text-4xl font-extrabold tracking-tight">Rapor Pemain</h1>
      <p class="mt-3 text-cream/65 leading-relaxed max-w-xl">
        Masukkan nama panggilan anak untuk melihat dan mengunduh rapor
        perkembangannya.
      </p>

      <form id="raporForm" class="mt-8 glass rounded-3xl p-5 sm:p-7" autocomplete="off">
        <label for="nama" class="block text-sm font-medium text-cream/85 mb-2">Nama Panggilan Anak</label>
        <div class="flex flex-col sm:flex-row gap-3">
          <input
            id="nama"
            name="nama"
            type="text"
            required
            maxlength="60"
            spellcheck="false"
            autocapitalize="words"
            class="field flex-1"
            placeholder="Contoh: Kafi"
          />
          <button id="cariBtn" type="submit" class="inline-flex btn btn-main px-7 py-3.5">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            Lihat Rapor
          </button>
        </div>
        <p id="pesan" class="hidden mt-4 text-sm rounded-xl px-4 py-3" role="status" aria-live="polite"></p>
      </form>

      <!-- Hasil -->
      <section id="hasil" class="hidden mt-6 glass rounded-3xl p-5 sm:p-7" aria-live="polite">
        <div class="flex items-start gap-4">
          <div class="w-12 h-12 shrink-0 rounded-2xl bg-accent/15 border border-accent/30 text-accent flex items-center justify-center">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
          </div>
          <div class="min-w-0">
            <p class="text-xs uppercase tracking-widest text-cream/50">Rapor ditemukan</p>
            <p id="namaFile" class="mt-1 font-bold text-lg break-all"></p>
          </div>
        </div>

        <img id="previewImg" class="hidden mt-6 w-full rounded-2xl border border-cream/10" alt="Pratinjau rapor" />

        <div class="mt-6 flex flex-col sm:flex-row gap-3">
          <a id="unduhBtn" href="#" download class="inline-flex btn btn-main px-7 py-3.5">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
            Download Rapor
          </a>
          <a id="bukaBtn" href="#" target="_blank" rel="noopener" class="inline-flex btn btn-ghost px-7 py-3.5">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
            Buka di Tab Baru
          </a>
        </div>
      </section>

      <p class="mt-10 text-sm text-cream/50">
        Rapor tidak ditemukan? Hubungi coach di
        <a href="https://wa.me/6281241081143?text=Assalamualaikum%20Coach%2C%20saya%20ingin%20menanyakan%20rapor%20anak%20saya." target="_blank" rel="noopener" class="text-accent hover:underline">WhatsApp 0812-4108-1143</a>.
      </p>
    </main>

    <footer class="relative text-center text-xs text-cream/35 py-6 border-t border-cream/5">
      &copy; <span id="year">2025</span> Aphix Private
    </footer>

    <script>
      /* =========================================================
         CARA KERJA
         File rapor disimpan di folder /rapor/ dengan nama = nama panggilan anak,
         huruf kecil, spasi diganti tanda strip.
         Contoh: "Kafi" -> rapor/kafi.pdf
         Format yang dicari berurutan: PDF, JPG, JPEG, PNG.
         Coach juga bisa mengirim link langsung: /rapor.html?nama=Kafi
         ========================================================= */
      const FORMAT = ["pdf", "jpg", "jpeg", "png"];

      // " Kafi " / "KAFI" -> "kafi",  "Abang Rizky" -> "abang-rizky"
      const keNamaFile = (teks) =>
        teks
          .normalize("NFD")
          .replace(/[̀-ͯ]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");

      const form = document.getElementById("raporForm");
      const input = document.getElementById("nama");
      const cariBtn = document.getElementById("cariBtn");
      const pesan = document.getElementById("pesan");
      const hasil = document.getElementById("hasil");
      const namaFile = document.getElementById("namaFile");
      const previewImg = document.getElementById("previewImg");
      const unduhBtn = document.getElementById("unduhBtn");
      const bukaBtn = document.getElementById("bukaBtn");

      function tampilPesan(teks, jenis) {
        pesan.textContent = teks;
        pesan.className =
          "mt-4 text-sm rounded-xl px-4 py-3 " +
          (jenis === "error"
            ? "bg-red-500/10 text-red-200 border border-red-400/20"
            : "bg-accent/10 text-cream/80 border border-accent/20");
      }

      // Cek apakah file ada tanpa mengunduh seluruh isinya
      async function adaFile(url) {
        try {
          const res = await fetch(url, { method: "HEAD", cache: "no-store" });
          const tipe = res.headers.get("content-type") || "";
          // beberapa hosting mengembalikan halaman HTML (bukan 404) untuk file yang tidak ada
          return res.ok && !tipe.includes("text/html");
        } catch {
          return false;
        }
      }

      async function cari(namaMentah) {
        const kode = keNamaFile(namaMentah);
        hasil.classList.add("hidden");

        if (kode.length < 2) {
          tampilPesan("Tulis nama panggilan anak terlebih dahulu.", "error");
          return;
        }

        cariBtn.disabled = true;
        tampilPesan("Mencari rapor...", "info");

        let ketemu = null;
        for (const ext of FORMAT) {
          const url = `/rapor/${encodeURIComponent(kode)}.${ext}`;
          if (await adaFile(url)) {
            ketemu = { url, ext };
            break;
          }
        }
        cariBtn.disabled = false;

        if (!ketemu) {
          tampilPesan("Rapor atas nama ini belum tersedia. Pastikan nama panggilan sudah benar, atau hubungi coach.", "error");
          return;
        }

        pesan.className = "hidden";
        const nama = `Rapor-Aphix-${kode}.${ketemu.ext}`;
        namaFile.textContent = nama;
        unduhBtn.href = ketemu.url;
        unduhBtn.setAttribute("download", nama);
        bukaBtn.href = ketemu.url;

        if (ketemu.ext === "pdf") {
          previewImg.classList.add("hidden");
          previewImg.removeAttribute("src");
        } else {
          previewImg.src = ketemu.url;
          previewImg.classList.remove("hidden");
        }
        hasil.classList.remove("hidden");
        history.replaceState(null, "", `?nama=${encodeURIComponent(namaMentah.trim())}`);
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        cari(input.value);
      });

      // Link langsung dari coach: rapor.html?nama=Kafi
      const namaUrl = new URLSearchParams(location.search).get("nama");
      if (namaUrl) {
        input.value = namaUrl;
        cari(namaUrl);
      }

      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
